strict-sigcheck = true

[YouTube_anddea]
enabled = true
brand = "RVX-anddea"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
changelog-keywords = ["YouTube"]
arch = "arm64-v8a"
patcher-args = "-OiconType='round' -OappIcon='xisr_yellow' -OrestoreOldSplashAnimation=true -OBackgroundColor='#99000000' -Oexplore=true -Osubscriptions=true -Osearch=true -OiconType='bold' -ObottomMargin='Minimum' -OrvxSettingsLabel='ReVanced Extended' -OcornerRadius='100.0dip' -OapplyCornerRadiusToPlaylistBottomBar=true -OdarkThemeBackgroundColor='Amoled Black' -OlightThemeBackgroundColor='White' -OstrokeColor='Chip' -OsettingsMenuIcon='revanced'"

[YouTube_anddea.patches]
"github:anddea/revanced-patches" = { version = "dev", include = ["Custom branding icon for YouTube", "Custom header for YouTube", "Hide Shorts dimming", "Hide shortcuts", "Theme"], exclude = ["Enable debug logging", "Translations for YouTube"] }

[YouTube]
enabled = true
brand = "YouTube"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
changelog-keywords = ["YouTube"]
arch = "arm64-v8a"
version = "exp"

[YouTube.patches]
"github:MorpheApp/morphe-patches" = { version = "latest", exclude = ["Custom branding", "Enable debugging", "Disable play store updates"] }

[YT-Music]
enabled = true
brand = "YT-Music"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
changelog-keywords = ["YouTube Music"]
arch = "arm64-v8a"
version = "exp"

[YT-Music.patches]
"github:MorpheApp/morphe-patches" = { version = "latest", exclude = ["Custom branding", "Enable debugging", "Disable play store updates"] }

[Reddit]
enabled = true
brand = "Reddit"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
version = "2026.29.0"
patcher-args = "-OisCurrentLevelOnly=true -OindentLineColors1='#0066FF' -OindentLineColors2='#FF2E88' -OindentLineColors3='#9B5CFF' -OindentLineColors4='#2DE2E6' -OindentLineColors5='#FF5FA2' -OindentLineColors6='#FF8A3D' -OindentLineColors7='#FFD166' -OindentLineColors8='#3CFF7F'"

[Reddit.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }
"github:jkennethcarino/adobo" = { version = "dev", include = ["Disable home feed auto-refresh"], exclude = ["Hide post view counts", "Disable screenshot banner", "Open external links directly", "Remove ads and telemetry", "Sanitize share links"] }

[Twitter]
enabled = true
brand = "Twitter"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"
changelog-keywords = ["Twitter"]
version = "auto"
arch = "arm64-v8a"

[Twitter.patches]
"github:crimera/piko" = { version = "dev", include = ["Browse tweet object"] }

[Instagram]
enabled = true
brand = "Instagram"
github-dlurl = "https://github.com/krvstek/uni-storage/releases/tag/instagram"
# apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
uptodown-dlurl = "https://instagram.en.uptodown.com/android"
changelog-keywords = ["Instagram"]
arch = "arm64-v8a"
patcher-args = "-e 'Clone' -OappName='Instagram' -e 'Theme' -Oamoled=true"

[Instagram.patches]
"github:crimera/piko" = { version = "dev", exclude = ["Change version code"] }

[Google-Photos]
enabled = false
brand = "GPhotos"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
uptodown-dlurl = "https://google-photos.en.uptodown.com/android"
version = "latest"
arch = "arm64-v8a"

[Google-Photos.patches]
"github:RookieEnough/De-Vanced" = []
