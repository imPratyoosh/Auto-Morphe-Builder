strict-sigcheck = true

[YouTube-ReVanced-Extended]
enabled = true
brand = "ReVanced-Extended"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
changelog-keywords = ["YouTube"]
arch = "arm64-v8a"
patcher-args = "-e 'Custom Shorts action buttons' -OiconType='round' -e 'Custom branding icon for YouTube' -OappIcon='xisr_yellow' -OrestoreOldSplashAnimation=true -e 'Force player buttons background' -OBackgroundColor='#99000000' -e 'Hide shortcuts' -Oexplore=true -Osubscriptions=true -Osearch=true -e 'Overlay buttons' -OiconType='bold' -ObottomMargin='0.1dip' -e 'Settings for YouTube' -OrvxSettingsLabel='ReVanced Extended' -e 'Snack bar components' -OcornerRadius='100.0dip' -OapplyCornerRadiusToPlaylistBottomBar=true -OdarkThemeBackgroundColor='@android:color/black' -OlightThemeBackgroundColor='@android:color/white' -OstrokeColor='?attr/ytChipBackground' -e 'Visual preferences icons for YouTube' -OsettingsMenuIcon='revanced'"

[YouTube-ReVanced-Extended.patches]
"github:anddea/revanced-patches" = { version = "dev", include = ["Custom header for YouTube", "Hide Shorts dimming", "Theme"], exclude = ["Enable debug logging", "Translations for YouTube"] }

[YouTube]
enabled = true
brand = "Morphe"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
uptodown-dlurl = "https://youtube.en.uptodown.com/android"
changelog-keywords = ["YouTube"]
arch = "arm64-v8a"
version = "exp"

[YouTube.patches]
"github:MorpheApp/morphe-patches" = { version = "latest", exclude = ["Custom branding", "Enable debugging", "Disable play store updates"] }

[YouTube-Music]
enabled = true
brand = "Morphe"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
uptodown-dlurl = "https://youtube-music.en.uptodown.com/android"
changelog-keywords = ["YouTube Music"]
arch = "arm64-v8a"
version = "exp"

[YouTube-Music.patches]
"github:MorpheApp/morphe-patches" = { version = "latest", exclude = ["Custom branding", "Enable debugging", "Disable play store updates"] }

[Reddit]
enabled = true
brand = "Morphe"
apkmirror-dlurl = "https://www.apkmirror.com/apk/redditinc/reddit"
uptodown-dlurl = "https://reddit-official-app.en.uptodown.com/android"
changelog-keywords = ["Reddit"]
version = "2026.29.0"
patcher-args = "-e 'Colorize comment indent lines' -OindentLineColors1='#0066FF' -OindentLineColors2='#FF2E88' -OindentLineColors3='#9B5CFF' -OindentLineColors4='#2DE2E6' -OindentLineColors5='#FF5FA2' -OindentLineColors6='#FF8A3D' -OindentLineColors7='#FFD166' -OindentLineColors8='#3CFF7F' -OisCurrentLevelOnly=true"

[Reddit.patches]
"github:MorpheApp/morphe-patches" = { version = "dev" }
"github:jkennethcarino/adobo" = { version = "dev", include = ["Disable home feed auto-refresh"], exclude = ["Hide post view counts", "Disable screenshot banner", "Open external links directly", "Sanitize share links"] }

[Twitter]
enabled = true
brand = "Piko"
apkmirror-dlurl = "https://www.apkmirror.com/apk/x-corp/twitter"
uptodown-dlurl = "https://twitter.en.uptodown.com/android"
changelog-keywords = ["Twitter"]
arch = "arm64-v8a"

[Twitter.patches]
"github:crimera/piko" = { version = "dev", include = ["Browse tweet object"] }

[Instagram]
enabled = true
brand = "Piko"
github-dlurl = "https://github.com/imPratyoosh/APKs-storage/releases/tag/instagram"
# apkmirror-dlurl = "https://www.apkmirror.com/apk/instagram/instagram-instagram"
# uptodown-dlurl = "https://instagram.en.uptodown.com/android"
changelog-keywords = ["Instagram"]
arch = "arm64-v8a"
patcher-args = "-e 'Clone' -OpackageName='com.instagram' -OappName='Instagram' -e 'Theme' -Oamoled=true"

[Instagram.patches]
"github:crimera/piko" = { version = "dev", exclude = ["Change version code"] }

[Google-Photos]
enabled = false
brand = "GPhotos"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/photos/"
uptodown-dlurl = "https://google-photos.en.uptodown.com/android"
version = "latest"
arch = "arm64-v8a"

[Google-Photos.patches]
"github:RookieEnough/De-Vanced" = []
